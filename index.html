<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Martal Group — Performance Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
/* ═══ MARTAL GROUP DESIGN SYSTEM — DUO / GLASS MORPHIC ═══════════════════
   Pulled directly from the canonical Martal Group Design System project
   (tokens/colors.css, tokens/glass.css, components/surfaces/GlassCard.jsx,
   ui_kits/website/Header.jsx). Same tokens the marketing site and AI SDR
   platform UI kit use — this is not a bespoke reskin.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* --- brand core --- */
  --mg-charcoal:#181818; --mg-green-500:#80b122; --mg-blue-500:#2d9cdb;
  --mg-green-400:#98c548; --mg-green-600:#66901b; --mg-green-100:#e6f1cf; --mg-green-50:#f3f8e6;
  --mg-blue-400:#57b2e5; --mg-blue-600:#2588bf; --mg-blue-100:#d5edf8; --mg-blue-50:#eaf6fc;
  --mg-black:#0d0d0d; --mg-ink-900:#181818; --mg-ink-800:#242424; --mg-ink-700:#303030;
  --mg-ink-600:#3d3d3d; --mg-ink-500:#565656; --mg-ink-400:#7a7a7a; --mg-ink-300:#a3a3a3;
  --mg-ink-200:#cfcfcf; --mg-ink-100:#e7e7e7; --mg-ink-50:#f4f4f4; --mg-white:#ffffff;

  /* --- semantic surfaces / text (colors.css) --- */
  --surface-page:#ffffff; --surface-card:#ffffff; --surface-muted:#f4f4f4; --surface-sunken:#e7e7e7;
  --text-strong:#181818; --text-body:#303030; --text-muted:#7a7a7a;
  --border-subtle:#e7e7e7; --border-default:#cfcfcf;

  /* --- glass fills (glass.css) --- */
  --glass-light-strong:rgba(255,255,255,.72); --glass-light-faint:rgba(255,255,255,.35);
  --glass-dark:rgba(24,24,24,.45); --glass-dark-strong:rgba(24,24,24,.62);
  --glass-tint-green:rgba(128,177,34,.16); --glass-tint-blue:rgba(45,156,219,.18);
  --glass-border-soft:rgba(255,255,255,.30); --glass-border-dark:rgba(255,255,255,.14);
  --blur-sm:8px; --blur-md:16px; --blur-lg:28px; --blur-xl:44px;
  --glass-sheen-soft:linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%);
  --glass-shadow:0 8px 32px rgba(24,24,24,.18), inset 0 1px 0 rgba(255,255,255,.5);
  --glass-shadow-dark:0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);

  /* --- liquid gradients (glass.css) --- the signature DUO mesh, used as a
     direct panel fill (hero/proof surfaces), not a page-wide wash */
  --liquid-duo:
    radial-gradient(90% 130% at 12% 8%, rgba(128,177,34,.55) 0%, rgba(128,177,34,0) 45%),
    radial-gradient(90% 120% at 92% 20%, rgba(45,156,219,.55) 0%, rgba(45,156,219,0) 48%),
    linear-gradient(160deg, #181818 0%, #0d0d0d 100%);

  /* --- Light Duo — the same green/blue pairing tuned for the light theme.
     Green pools one side, light blue the other, on a near-white base so
     white frosted-glass tiles float clearly on top. */
  --liquid-duo-light:
    radial-gradient(100% 140% at 6% 20%, rgba(128,177,34,.40) 0%, rgba(128,177,34,0) 60%),
    radial-gradient(100% 140% at 96% 30%, rgba(45,156,219,.38) 0%, rgba(45,156,219,0) 62%),
    linear-gradient(120deg, #eef6df 0%, #f6faf1 35%, #eef8fd 70%, #e3f3fc 100%);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--surface-page);}
body{
  font-family:'Montserrat',system-ui,sans-serif;
  color:var(--text-strong);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,select{font-family:inherit;font-variant-numeric:inherit;}

/* ═══ GLASS ACTIVATION ═══════════════════════════════════════════════════
   Matches components/surfaces/GlassCard.jsx: backdrop blur+saturate, a lit
   sheen overlay, floating shadow. Applied wherever a panel sits on the
   liquid-duo mesh or on charcoal. */
[style*="--glass-dark-strong"]{-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);}
[style*="--glass-light-strong"]{-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);}
[style*="--glass-tint-green"],[style*="--glass-tint-blue"]{-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);}

/* ═══ CHROME ═════════════════════════════════════════════════════════════ */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(24,24,24,.18);border-radius:10px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(24,24,24,.30);background-clip:content-box;}
::selection{background:rgba(128,177,34,.28);color:#181818;}

button,a{transition:color .18s,background .18s,border-color .18s,opacity .18s,box-shadow .18s,transform .18s;}
:focus-visible{outline:2px solid #2d9cdb;outline-offset:2px;border-radius:4px;}

/* Primary CTA — accent button spec */
.martal-cta{
  background:linear-gradient(180deg,#93C43A 0%,#80B122 45%,#74A21E 100%)!important;
  color:#FFFFFF!important;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px rgba(128,177,34,.35),0 2px 6px rgba(24,24,24,.12)!important;
}
.martal-cta:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px rgba(128,177,34,.45),0 2px 6px rgba(24,24,24,.12)!important;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ─── COMPANY DATA (Cash Flow & Billings sheet) ────────────────────────────────
const RAW = [
  {m:"Feb 22",ac:82,dc:12,cl:19},{m:"Mar 22",ac:81,dc:17,cl:15},

  {m:"Jun 22",ac:85,dc:17,cl:17},{m:"Jul 22",ac:88,dc:21,cl:9},
  {m:"Aug 22",ac:93,dc:22,cl:16},{m:"Sep 22",ac:97,dc:16,cl:9},
  {m:"Oct 22",ac:85,dc:8,cl:20},{m:"Nov 22",ac:83,dc:7,cl:12},
  {m:"Dec 22",ac:75,dc:7,cl:11},{m:"Jan 23",ac:75,dc:13,cl:15},
  {m:"Feb 23",ac:76,dc:16,cl:10},{m:"Mar 23",ac:86,dc:17,cl:7},
  {m:"Apr 23",ac:97,dc:21,cl:14},{m:"May 23",ac:95,dc:11,cl:18},
  {m:"Jun 23",ac:91,dc:12,cl:19},{m:"Jul 23",ac:91,dc:18,cl:12},
  {m:"Aug 23",ac:90,dc:13,cl:16},{m:"Sep 23",ac:96,dc:18,cl:11},
  {m:"Oct 23",ac:96,dc:13,cl:13},{m:"Nov 23",ac:89,dc:15,cl:23},
  {m:"Dec 23",ac:89,dc:17,cl:11},{m:"Jan 24",ac:92,dc:12,cl:11},
  {m:"Feb 24",ac:99,dc:21,cl:15},{m:"Mar 24",ac:98,dc:15,cl:19},
  {m:"Apr 24",ac:99,dc:21,cl:21},{m:"May 24",ac:104,dc:23,cl:20},
  {m:"Jun 24",ac:106,dc:20,cl:22},{m:"Jul 24",ac:105,dc:25,cl:21},
  {m:"Aug 24",ac:105,dc:13,cl:15},{m:"Sep 24",ac:100,dc:13,cl:28},
  {m:"Oct 24",ac:100,dc:28,cl:25},{m:"Nov 24",ac:88,dc:11,cl:20},
  {m:"Dec 24",ac:85,dc:17,cl:18},{m:"Jan 25",ac:96,dc:26,cl:22},
  {m:"Feb 25",ac:103,dc:29,cl:14},{m:"Mar 25",ac:109,dc:22,cl:16},
  {m:"Apr 25",ac:106,dc:15,cl:16},{m:"May 25",ac:101,dc:19,cl:23},
  {m:"Jun 25",ac:95,dc:15,cl:19},{m:"Jul 25",ac:87,dc:16,cl:24},
  {m:"Aug 25",ac:95,dc:23,cl:13},{m:"Sep 25",ac:100,dc:18,cl:16},
  {m:"Oct 25",ac:99,dc:19,cl:13},{m:"Nov 25",ac:94,dc:12,cl:16},
  {m:"Dec 25",ac:101,dc:23,cl:15},{m:"Jan 26",ac:105,dc:22,cl:15},
  {m:"Feb 26",ac:106,dc:23,cl:17},{m:"Mar 26",ac:110,dc:14,cl:11},
  {m:"Apr 26",ac:114,dc:19,cl:13},
  {m:"May 26",ac:103,dc:16,cl:27},
  {m:"Jun 26",ac:90,dc:12,cl:20},
  {m:"Jul 26",ac:80,dc:16,cl:21},
];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mIdx = m => { const p=m.split(" "); return parseInt(p[1])*12+MO.indexOf(p[0]); };
const withCR = arr => arr.map((d,i)=>{
  if(i<3) return {...d,cr:null};
  const avg=(arr[i-1].ac+arr[i-2].ac+arr[i-3].ac)/3;
  return {...d,cr:parseFloat(((d.cl/avg)*100).toFixed(2))};
});
const CD = withCR(RAW);
const ALL_M = CD.map(d=>d.m);

// ─── CHURN SCORING ────────────────────────────────────────────────────────────
const PEN={"Rep Issue":8,"Sales Ops Issue":8,"Lack of Results":6,"No Closed Deals":6,"Single Rep Account":5,"No Show Issue":5,"Poor List Quality":3,"Slow Start":3,"Budget Issue":1,"Didnt Pay":1,"Accepted Landbase":1,"Leadership Intervention":2};

// ─── MARTAL BRAND TOKENS ─── pulled from the canonical Design System project ──
const G="#80B122";            /* --mg-green-500 — fills only, white text on top */
const G_TEXT="#66901B";        /* --mg-green-600 — AA-safe green for text on light */
const G_DARK="#4F6E13";        /* --mg-green-700 */
const G_LIGHT="#F3F8E6";       /* --mg-green-50 */
const ANNOUNCE="var(--glass-dark-strong)";
const BG="var(--surface-page)";
const CARD="var(--surface-card)";      /* plain white — matches Card.jsx, not glass */
const CARD2="var(--surface-muted)";
const CARD3="var(--surface-sunken)";
const BORDER="var(--border-subtle)";
const BORDER2="var(--border-default)";
const TEXT="var(--text-strong)";       /* #181818 */
const MUTED="var(--text-body)";        /* #303030 */
const MUTED2="var(--text-muted)";      /* #7a7a7a */
const SHADOW="0 1px 3px rgba(24,24,24,.06), 0 4px 10px rgba(24,24,24,.04)";  /* shadow-sm, per Card elevation="sm" */
const SHADOW_MD="0 4px 16px rgba(24,24,24,.08), 0 12px 32px rgba(24,24,24,.06)";
const FONT_DISPLAY = "'Montserrat',sans-serif";
const FONT_BODY = "'Montserrat',sans-serif";
const FONT_MONO = "'Montserrat',sans-serif";

/* ── The DUO liquid-glass hero panel ──────────────────────────────────────
   Matches ui_kits/ai-sdr-platform/Dashboard.jsx's "Pipeline progression"
   treatment: --liquid-duo as a direct panel fill, white text on top, no
   separate glass wrapper — the mesh IS the surface. */
const C_BG="var(--liquid-duo)";
const C_BORDER="rgba(255,255,255,.14)";  /* --glass-border-dark */
const C_RAISED="rgba(255,255,255,.10)";
const C_TEXT="#FFFFFF";
const C_MUTED="var(--mg-ink-200)";     /* #cfcfcf — Dashboard.jsx secondary-on-duo */
const C_GREEN="var(--mg-green-400)";   /* #98c548 — Dashboard.jsx accent-on-duo */
const C_PANEL={background:C_BG,borderRadius:"var(--radius-lg, 16px)",padding:"28px 32px",marginBottom:16,
  boxShadow:"var(--glass-shadow-dark)",position:"relative",overflow:"hidden"};

// Green-only churn scale: dark green (good/low) → light yellow-green (bad/high)
const crCol=v=>v==null?MUTED:v<10?"#6B961C":v<15?"#E5A000":v<20?"#B7791F":"#B43232";
const rsnCol=r=>{if(!r)return MUTED;if(["Rep Issue","Sales Ops Issue"].includes(r))return"#B43232";if(["Lack of Results","No Closed Deals","No Show Issue","Single Rep Account"].includes(r))return"#B7791F";if(["Poor List Quality","Slow Start"].includes(r))return"#B7791F";return G;};
const churnScore=accs=>Math.min(100,Math.round(accs.filter(a=>a.end).reduce((s,a)=>s+(PEN[a.reason]||1),0)));

const TT={contentStyle:{background:"#FFFFFF",border:`1px solid ${BORDER2}`,borderRadius:4,color:TEXT,fontFamily:FONT_BODY,fontSize:12,boxShadow:"0 2px 8px rgba(24,24,24,0.1)"}};

// ─── CUSTOM SVG CHARTS (no external library) ──────────────────────────────────
function useContainerWidth(ref){
  const [w,setW]=useState(600);
  useEffect(()=>{
    if(!ref.current)return;
    const ro=new ResizeObserver(e=>setW(Math.max(e[0].contentRect.width,100)));
    ro.observe(ref.current);
    return()=>ro.disconnect();
  },[]);
  return w;
}

// Colored bar chart (one color per bar via colorFn)
function SvgBarChart({data,dataKey,colorFn,xKey='m',yFmt=v=>v,height=130}){
  const ref=useRef(null); const w=useContainerWidth(ref);
  const [tip,setTip]=useState(null);
  const pad={l:36,r:8,t:8,b:22};
  const cW=w-pad.l-pad.r, cH=height-pad.t-pad.b;
  const vals=data.map(d=>d[dataKey]).filter(v=>v!=null&&!isNaN(v));
  const maxV=Math.max(...vals,0.01);
  const gap=cW/data.length;
  const bW=Math.max(3,gap*0.65);
  const yTicks=[0,maxV*0.5,maxV].map(v=>parseFloat(v.toFixed(1)));
  return(
    <div ref={ref} style={{width:'100%',height}}>
      <svg width={w} height={height}>
        {yTicks.map((t,i)=>{const y=pad.t+cH-(t/maxV)*cH;return(<g key={i}><line x1={pad.l} y1={y} x2={pad.l+cW} y2={y} stroke={BORDER} strokeDasharray="3 3"/><text x={pad.l-3} y={y+3} textAnchor="end" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{yFmt(t)}</text></g>);})}
        {data.map((d,i)=>{
          const v=d[dataKey]; if(v==null||isNaN(v))return null;
          const bH=(v/maxV)*cH; const x=pad.l+i*gap+(gap-bW)/2; const y=pad.t+cH-bH;
          const fill=colorFn?colorFn(v):'#6B961C';
          const isProj=!!d.projected;
          return(<rect key={i} x={x} y={y} width={bW} height={Math.max(bH,0)} fill={fill} fillOpacity={isProj?0.32:1} stroke={isProj?fill:'none'} strokeWidth={isProj?1.5:0} strokeDasharray={isProj?'3 2':'none'} rx={2} onMouseEnter={()=>setTip({x:x+bW/2,y,v,label:d[xKey]+(isProj?' (projected)':'')})} onMouseLeave={()=>setTip(null)}/>);
        })}
        {data.map((d,i)=>{if(i%(Math.ceil(data.length/8))!==0&&i!==data.length-1)return null;return(<text key={i} x={pad.l+i*gap+gap/2} y={height-4} textAnchor="middle" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{d[xKey]}</text>);})}
        <line x1={pad.l} y1={pad.t+cH} x2={pad.l+cW} y2={pad.t+cH} stroke={BORDER2}/>
        {tip&&(<g><rect x={Math.min(tip.x-24,w-54)} y={tip.y-28} width={48} height={20} rx={3} fill="#181818" opacity={0.82}/><text x={Math.min(tip.x-24,w-54)+24} y={tip.y-14} textAnchor="middle" fontSize={9} fill="#fff" fontWeight="700" fontFamily={FONT_BODY}>{yFmt(tip.v)}</text></g>)}
      </svg>
    </div>
  );
}

// Multi-series bar chart (grouped, two bars per data point)
function SvgGroupedBarChart({data,series,xKey='m',height=120}){
  const ref=useRef(null); const w=useContainerWidth(ref);
  const [tip,setTip]=useState(null);
  const pad={l:30,r:8,t:8,b:22};
  const cW=w-pad.l-pad.r, cH=height-pad.t-pad.b;
  const allVals=series.flatMap(s=>data.map(d=>d[s.key]||0));
  const maxV=Math.max(...allVals,0.01);
  const gap=cW/data.length;
  const groupW=gap*0.8; const bW=groupW/series.length;
  const yTicks=[0,Math.round(maxV*0.5),Math.round(maxV)];
  return(
    <div ref={ref} style={{width:'100%',height}}>
      <svg width={w} height={height}>
        {yTicks.map((t,i)=>{const y=pad.t+cH-(t/maxV)*cH;return(<g key={i}><line x1={pad.l} y1={y} x2={pad.l+cW} y2={y} stroke={BORDER} strokeDasharray="3 3"/><text x={pad.l-3} y={y+3} textAnchor="end" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{t}</text></g>);})}
        {data.map((d,di)=>series.map((s,si)=>{
          const v=d[s.key]||0; const bH=(v/maxV)*cH;
          const x=pad.l+di*gap+(gap-groupW)/2+si*bW; const y=pad.t+cH-bH;
          return(<rect key={`${di}-${si}`} x={x} y={y} width={Math.max(bW-1,2)} height={Math.max(bH,0)} fill={s.fill} rx={2} onMouseEnter={()=>setTip({x:x+bW/2,y,label:s.name,v})} onMouseLeave={()=>setTip(null)}/>);
        }))}
        {data.map((d,i)=>{if(i%(Math.ceil(data.length/8))!==0&&i!==data.length-1)return null;return(<text key={i} x={pad.l+i*gap+gap/2} y={height-4} textAnchor="middle" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{d[xKey]}</text>);})}
        <line x1={pad.l} y1={pad.t+cH} x2={pad.l+cW} y2={pad.t+cH} stroke={BORDER2}/>
        {/* Legend */}
        {series.map((s,i)=>(<g key={i}><rect x={pad.l+i*70} y={2} width={8} height={8} fill={s.fill} rx={1}/><text x={pad.l+i*70+11} y={9} fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{s.name}</text></g>))}
        {tip&&(<g><rect x={Math.min(tip.x-24,w-60)} y={tip.y-28} width={56} height={20} rx={3} fill="#181818" opacity={0.82}/><text x={Math.min(tip.x-24,w-60)+28} y={tip.y-14} textAnchor="middle" fontSize={9} fill="#fff" fontWeight="700" fontFamily={FONT_BODY}>{tip.label}: {tip.v}</text></g>)}
      </svg>
    </div>
  );
}

// Multi-line chart. When the last data point has `projected:true`, that final
// segment renders dashed/faded with a hollow marker instead of a solid line.
function SvgLineChart({data,lines=[],xKey='m',height=100}){
  const ref=useRef(null); const w=useContainerWidth(ref);
  const hasLegend=lines.length>1&&lines.some(l=>l.name);
  const pad={l:30,r:8,t:hasLegend?20:8,b:22};
  const cW=w-pad.l-pad.r, cH=height-pad.t-pad.b;
  const allVals=lines.flatMap(l=>data.map(d=>d[l.key]).filter(v=>v!=null&&!isNaN(v)));
  const maxV=Math.max(...allVals,0.01); const minV=0;
  const xS=i=>pad.l+(i/(Math.max(data.length-1,1)))*cW;
  const yS=v=>pad.t+cH-((v-minV)/(maxV-minV||1))*cH;
  const yTicks=[0,Math.round(maxV*0.5),Math.round(maxV)];
  const lastProjected=data.length>0&&!!data[data.length-1].projected;
  // Legend items are spaced by estimated text width (not a fixed pixel offset) so
  // labels never overlap regardless of chart width or label length, and it sits in
  // its own top row so it never collides with the x-axis month labels at the bottom.
  let legendX=pad.l;
  const legendItems=hasLegend?lines.map(l=>{
    const x=legendX;
    legendX+=14+4+(l.name||'').length*5.3+16;
    return {...l,x};
  }):[];
  return(
    <div ref={ref} style={{width:'100%',height}}>
      <svg width={w} height={height}>
        {hasLegend&&legendItems.map((l,i)=>(<g key={i}><line x1={l.x} y1={9} x2={l.x+14} y2={9} stroke={l.stroke} strokeWidth={2}/><text x={l.x+18} y={12} fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{l.name}</text></g>))}
        {yTicks.map((t,i)=>{const y=yS(t);return(<g key={i}><line x1={pad.l} y1={y} x2={pad.l+cW} y2={y} stroke={BORDER} strokeDasharray="3 3"/><text x={pad.l-3} y={y+3} textAnchor="end" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{t}</text></g>);})}
        {lines.map((l,li)=>{
          const idxs=data.map((d,i)=>i).filter(i=>data[i][l.key]!=null&&!isNaN(data[i][l.key]));
          const solidIdxs=lastProjected?idxs.filter(i=>i<data.length-1):idxs;
          const solidPts=solidIdxs.map(i=>`${xS(i)},${yS(data[i][l.key])}`).join(' ');
          const tailIdxs=lastProjected&&idxs.length>=2?idxs.slice(-2):null;
          const tailPts=tailIdxs?tailIdxs.map(i=>`${xS(i)},${yS(data[i][l.key])}`).join(' '):null;
          const lastIdx=idxs.length?idxs[idxs.length-1]:null;
          return(<g key={li}>
            <polyline points={solidPts} fill="none" stroke={l.stroke||'#6B961C'} strokeWidth={l.width||2}/>
            {tailPts&&<polyline points={tailPts} fill="none" stroke={l.stroke||'#6B961C'} strokeWidth={l.width||2} strokeDasharray="4 3" opacity={0.6}/>}
            {lastProjected&&lastIdx!=null&&<circle cx={xS(lastIdx)} cy={yS(data[lastIdx][l.key])} r={3.5} fill="#fff" stroke={l.stroke} strokeWidth={2}/>}
          </g>);
        })}
        {data.map((d,i)=>{if(i%(Math.ceil(data.length/7))!==0&&i!==data.length-1)return null;return(<text key={i} x={xS(i)} y={height-4} textAnchor="middle" fontSize={8} fill={MUTED} fontFamily={FONT_BODY}>{d[xKey]}</text>);})}
        <line x1={pad.l} y1={pad.t+cH} x2={pad.l+cW} y2={pad.t+cH} stroke={BORDER2}/>
      </svg>
    </div>
  );
}

function personMonthly(accs) {
  return ALL_M.map(m=>{
    const mi=mIdx(m); let ac=0,cl=0;
    accs.forEach(a=>{
      const s=mIdx(a.start),e=a.end?mIdx(a.end):Infinity;
      if(s<=mi){if(!a.end)ac++;else if(e===mi)cl++;else if(e>mi)ac++;}
    });
    return{m,ac,cl};
  }).filter(d=>d.ac>0||d.cl>0);
}
function personCR(accs){
  const mo=personMonthly(accs);
  return withCR(mo).filter(d=>d.cr!==null&&d.ac>0);
}

function sqlPaceStatus(cur, marchSQL){
  if(marchSQL===null||marchSQL===undefined) return {label:"No prior-period baseline",color:MUTED};
  const pct=marchSQL>0?cur/marchSQL:null;
  if(pct===null) return {label:"No prior-period data",color:MUTED};
  if(pct>=1.1)   return {label:"Exceeding last period",color:G};
  if(pct>=0.95)  return {label:"Matching last period",color:"#E5A000"};
  if(pct>=0.5)   return {label:"Below last period",color:"#B7791F"};
  return           {label:"Well below last period",color:"#D64242"};
}

function paceCol(val,key){
  if(key==="mtg") return val>=8?"#6B961C":val>=4?"#E5A000":val>=1?"#B7791F":"#D64242";
  if(key==="sql") return val>=15?"#6B961C":val>=8?"#E5A000":val>=3?"#B7791F":"#D64242";
  if(key==="mql") return val>=40?"#6B961C":val>=20?"#E5A000":val>=8?"#B7791F":"#D64242";
  return MUTED;
}

function getRepAccounts(repName) {
  const accs=[];
  SOMS.forEach(s=>{
    s.accounts.forEach(a=>{
      if(a.reps&&a.reps.includes(repName)) accs.push({...a,som:s.name});
    });
  });
  return accs;
}

// Uses visibility:hidden trick — only the modal prints, rest of page hidden
function usePrintStyle(){
  useEffect(()=>{
    const s=document.createElement('style');
    s.id='__mp';
    s.textContent=`@media print{body *{visibility:hidden!important}#__mpm,#__mpm *{visibility:visible!important}#__mpm{position:fixed;top:0;left:0;width:100%;padding:0}.__nop{display:none!important}}`;
    document.head.appendChild(s);
    return()=>document.getElementById('__mp')?.remove();
  },[]);
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){resolve();return;}
    const s=document.createElement('script');
    s.src=src; s.onload=resolve; s.onerror=reject;
    document.head.appendChild(s);
  });
}

const G_RGB=[90,171,31], DARK_RGB=[13,13,13], MUTED_RGB=[112,112,112], RED_RGB=[239,68,68], BORDER_RGB=[212,212,212], STRIPE_RGB=[243,243,243];

function pdfText(doc,txt,x,y,opts={}){
  if(txt==null) return;
  doc.text(String(txt),x,y,opts);
}

async function buildRepPDF(repName, accs){

  doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=7;

  // ── Performance — Aug 15 Period Complete ──
  if(p){
    // Section label + rank badges (Jul 15 + Aug 15)
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.setTextColor(...MUTED_RGB);
    pdfText(doc,'PERFORMANCE — AUG 15 PERIOD COMPLETE (7/16–8/15)',M,y);
    // Two stacked rank badges on right: Last Period Rank + This Period Rank
    const rankW=26, rankH=10, rankGap=2;
    let rx = W - M - (rankW*2 + rankGap);
    if(p.marchRank!=null){
      doc.setFillColor(...DARK_RGB);
      doc.roundedRect(rx,y-6,rankW,rankH,1.5,1.5,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(5.5);
      pdfText(doc,'JUL 15 RANK (PREV)',rx+rankW/2,y-2,{align:'center'});
      doc.setFontSize(9); doc.setFont('helvetica','bold');
      pdfText(doc,`#${p.marchRank}`,rx+rankW/2,y+3,{align:'center'});
      rx += rankW + rankGap;
    }
    if(p.aprRank!=null){
      doc.setFillColor(...DARK_RGB);
      doc.roundedRect(rx,y-6,rankW,rankH,1.5,1.5,'F');
      doc.setTextColor(...G_RGB);
      doc.setFontSize(5.5); doc.setFont('helvetica','bold');
      pdfText(doc,'AUG 15 RANK',rx+rankW/2,y-2,{align:'center'});
      doc.setFontSize(9);
      pdfText(doc,`#${p.aprRank}`,rx+rankW/2,y+3,{align:'center'});
    }
    y+=8;

    // Overall status line (Exceeding / Matching / Below Jul 15)
    if(p.marchSQL && p.curSQL!=null){
      const sqlPct = p.curSQL / p.marchSQL;
      const statusLabel = sqlPct>=1.1 ? 'Exceeding Jul 15' : sqlPct>=0.95 ? 'Matching Jul 15' : sqlPct>=0.5 ? 'Below Jul 15' : 'Well below Jul 15';
      const statusCol = sqlPct>=1.1 ? G_RGB : sqlPct>=0.95 ? [245,197,24] : sqlPct>=0.5 ? [249,115,22] : RED_RGB;
      doc.setFontSize(8); doc.setFont('helvetica','bold');
      doc.setTextColor(...statusCol);
      pdfText(doc,statusLabel,M,y);
      y+=5;
    }

    const metrics=[
      {label:'SQLs',    march:p.marchSQL,   cur:p.curSQL,  key:'sql', barMax:60},
      {label:'Meetings',march:p.marchFlips, cur:p.curMtg,  key:'mtg', barMax:35},
      {label:'MQLs',    march:p.marchMQL,   cur:p.curMQL,  key:'mql', barMax:160},
    ];
    const barL=46, barR=W-M-40, barW=barR-barL;  // leave 40mm on right for text labels
    const pctCol=(pct)=>pct>=110?G_RGB:pct>=95?[245,197,24]:pct>=50?[249,115,22]:[239,68,68];

    for(const m of metrics){
      const delta = m.march!=null ? m.cur - m.march : null;
      const pct = m.march>0 ? Math.round((m.cur/m.march)*100) : null;
      const bMax = Math.max(m.march||1, m.cur, 1);

      // Metric header with % of Jul 15 + delta vs Jul 15 on right
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.setTextColor(...MUTED_RGB);
      pdfText(doc,m.label.toUpperCase(),M,y);
      if(pct!=null){
        doc.setTextColor(...pctCol(pct));
        pdfText(doc,`${pct}% of last period`,barR+2,y);
      }
      if(delta!=null){
        const dc = delta>0 ? G_RGB : delta<0 ? RED_RGB : [245,197,24];
        doc.setTextColor(...dc);
        pdfText(doc,`${delta>0?'+':''}${delta} vs Jul 15`,W-M,y,{align:'right'});
      }
      y+=4.5;

      // Jul 15 Final row
      doc.setFontSize(7.5); doc.setFont('helvetica','normal');
      doc.setTextColor(...MUTED_RGB);
      pdfText(doc,'Jul 15 Final',M,y);
      pdfText(doc,String(m.march??'—'),barL-2,y,{align:'right'});
      doc.setFillColor(190,190,190);
      const mW = m.march!=null ? (m.march/bMax)*barW : 0;
      doc.rect(barL, y-2.8, mW, 2, 'F');
      y+=4;

      // Aug 15 Final row
      doc.setFont('helvetica','bold');
      doc.setTextColor(...G_RGB);
      pdfText(doc,'Aug 15 Final',M,y);
      pdfText(doc,String(m.cur),barL-2,y,{align:'right'});
      doc.setFillColor(...G_RGB);
      doc.rect(barL, y-2.8, (m.cur/bMax)*barW, 2, 'F');
      y+=4;

      doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=3.5;
    }

    // Footer note
    doc.setFontSize(6.5); doc.setFont('helvetica','italic');
    doc.setTextColor(...MUTED_RGB);
    pdfText(doc,'Ranking period complete. Totals reflect 30-day window 7/16–8/15/2026. Next ranking period ends September 15.',M,y);
    y+=5;
  }

  // ── Churn stat cards (single row) ──
  const total=accs.length;
  const cr=total?((churned.length/total)*100).toFixed(1):0;
  const crNum=parseFloat(cr);
  const crColor=crNum<10?G_RGB:crNum<15?[245,197,24]:crNum<20?[249,115,22]:RED_RGB;
  const cs=churnScore(accs);
  const stats=[
    {l:'Active Accounts',v:String(active.length),c:G_RGB},
    {l:'Churned',v:String(churned.length),c:RED_RGB},
    {l:'Acct Churn Rate',v:`${cr}%`,c:crColor,s:'churned ÷ total'},
    {l:'12-Mo Avg CR',v:'—',c:[141,198,63]},
    {l:'Churn Score',v:String(cs),c:cs<15?G_RGB:cs<35?[141,198,63]:[188,217,122],s:'lower = better'},
  ];
  const cw=(W-M*2-4*3)/5;
  stats.forEach((st,i)=>{
    const cx=M+i*(cw+3);
    doc.setFillColor(255,255,255);
    doc.setDrawColor(...BORDER_RGB);
    doc.roundedRect(cx,y,cw,14,1,1,'FD');
    doc.setFontSize(6); doc.setFont('helvetica','bold');
    doc.setTextColor(...MUTED_RGB);
    pdfText(doc,st.l.toUpperCase(),cx+3,y+4);
    doc.setFontSize(11); doc.setFont('helvetica','bold');

    pdfText(doc,st.v,cx+3,y+11);
    if(st.s){doc.setFontSize(5.5);doc.setFont('helvetica','normal');doc.setTextColor(...MUTED_RGB);pdfText(doc,st.s,cx+3,y+13.5);}
  });
  y+=19;

  // ── Account table ──
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.setTextColor(...MUTED_RGB);
  pdfText(doc,`ACCOUNT DETAIL — ${total} ACCOUNTS`,M,y); y+=3;
  doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=4;

  const cols=[M,75,95,120,158];
  const hdrs=['ACCOUNT','START','STATUS','REASON','REPS'];
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.setTextColor(...MUTED_RGB);
  hdrs.forEach((h,i)=>pdfText(doc,h,cols[i],y));
  y+=2; doc.setDrawColor(190,190,190); doc.line(M,y,W-M,y); y+=4;

  const sorted=[...accs].sort((a,b)=>a.end?1:-1);
  for(let i=0;i<sorted.length;i++){
    const a=sorted[i];
    if(y>278){doc.addPage();y=15;}
    if(i%2===1){doc.setFillColor(...STRIPE_RGB);doc.rect(M,y-3,W-M*2,5.5,'F');}
    doc.setFontSize(7.5); doc.setFont('helvetica','bold');
    doc.setTextColor(...DARK_RGB);
    pdfText(doc,a.name,cols[0],y);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...MUTED_RGB);
    pdfText(doc,a.start||'',cols[1],y);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...(a.end?RED_RGB:G_RGB));
    pdfText(doc,a.end?`Churned ${a.end}`:'Active',cols[2],y);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...MUTED_RGB);
    pdfText(doc,a.reason||'—',cols[3],y);
    doc.setFontSize(6.5);
    const repsStr=(a.reps||[]).join(', ');
    pdfText(doc,repsStr.length>28?repsStr.slice(0,28)+'…':repsStr,cols[4],y);
    y+=5.5;
  }

  // Footer
  y+=4;
  doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=4;
  doc.setFontSize(7); doc.setFont('helvetica','normal');
  doc.setTextColor(...MUTED_RGB);
  pdfText(doc,'Martal Group — Internal Use Only',M,y);
  pdfText(doc,`${repName} · Period 3/16–4/15/2026`,W-M,y,{align:'right'});

  doc.save(`${repName.replace(/\s+/g,'_')}_Report_Jul2026.pdf`);
}

    pdfText(doc,`${r.curSQL}/${r.marchSQL??'—'}`,tc[2],y);
    doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(...(st?.color===G?G_RGB:MUTED_RGB));
    pdfText(doc,`${pct(r.curSQL,r.marchSQL)}→${pct(pr(r.curSQL),r.marchSQL)}`,tc[3],y);
    doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...(st?.color===G?G_RGB:MUTED_RGB));
    pdfText(doc,String(pr(r.curSQL)),tc[4],y);
    doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED_RGB);
    pdfText(doc,`${r.curMtg}/${r.marchFlips??'—'}`,tc[5],y);
    doc.setFontSize(6);
    pdfText(doc,`${pct(r.curMtg,r.marchFlips)}→${pct(pr(r.curMtg),r.marchFlips)}`,tc[6],y);
    doc.setFontSize(7);
    pdfText(doc,`${r.curMQL}/${r.marchMQL??'—'}`,tc[7],y);
    doc.setFontSize(6);
    pdfText(doc,`${pct(r.curMQL,r.marchMQL)}→${pct(pr(r.curMQL),r.marchMQL)}`,tc[8],y);
    y+=5;
  }
  y+=5;

  // Account table
  doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...MUTED_RGB);
  pdfText(doc,`ACCOUNT PORTFOLIO — ${active.length} ACTIVE · ${churned.length} CHURNED`,M,y); y+=3;
  doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=4;
  const ac=[M,75,95,120,158];
  ['ACCOUNT','START','STATUS','REASON','REPS'].forEach((h,i)=>{doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...MUTED_RGB);pdfText(doc,h,ac[i],y);});
  y+=2; doc.setDrawColor(190,190,190); doc.line(M,y,W-M,y); y+=4;

  const accsSort=[...active,...churned];
  for(let i=0;i<accsSort.length;i++){
    const a=accsSort[i];
    if(y>278){doc.addPage();y=15;}
    if(i%2===1){doc.setFillColor(...STRIPE_RGB);doc.rect(M,y-3,W-M*2,5.5,'F');}
    doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK_RGB);
    pdfText(doc,a.name,ac[0],y);
    doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED_RGB);
    pdfText(doc,a.start||'',ac[1],y);
    doc.setFont('helvetica','bold'); doc.setTextColor(...(a.end?RED_RGB:G_RGB));
    pdfText(doc,a.end?`Churned ${a.end}`:'Active',ac[2],y);
    doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED_RGB);
    pdfText(doc,a.reason||'—',ac[3],y);
    doc.setFontSize(6.5);
    const rs=(a.reps||[]).join(', ');
    pdfText(doc,rs.length>28?rs.slice(0,28)+'…':rs,ac[4],y);
    y+=5.5;
  }

  y+=4; doc.setDrawColor(...BORDER_RGB); doc.line(M,y,W-M,y); y+=4;
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED_RGB);
  pdfText(doc,'Martal Group — Internal Use Only',M,y);
  pdfText(doc,`${som.name} · Period 3/16–4/15/2026`,W-M,y,{align:'right'});

  doc.save(`${som.name.replace(/\s+/g,'_')}_SOM_Report_Jul2026.pdf`);
}

// Helpers
function somStatus(g){
  if(!g) return {label:"—",color:"#4D4D51",bg:"#F4F4F5"};
  if(g.mtgApr === null && g.q1 === 0) return {label:"NO ACTIVITY",color:"#4D4D51",bg:"#F4F4F5"};
  if(g.q1 === 0) return {label:"NO BASELINE",color:"#4D4D51",bg:"#F4F4F5"};
  if(g.q2 > g.budget) return {label:"OVER TARGET",color:"#B43232",bg:"#FBEAEA"};
  if(g.q2 === g.budget) return {label:"AT LIMIT",color:"#B7791F",bg:"#FBF3DD"};
  if(g.aprR <= g.q2tr) return {label:"ON TRACK",color:"#6B961C",bg:"#F2F7E6"};
  return {label:"WATCH",color:"#E5A000",bg:"#FBF3DD"};
}

function KpiCard(props){
  return (<div style={{flex:1,minWidth:140,background:CARD,border:"1px solid "+BORDER,borderRadius:8,padding:"16px 18px",minHeight:108,display:"flex",flexDirection:"column",justifyContent:"space-between",position:"relative",overflow:"hidden"}}>
    <div style={{fontSize:9,letterSpacing:"1.5px",textTransform:"uppercase",color:MUTED,fontFamily:FONT_BODY,fontWeight:700}}>{props.label}</div>
    <div style={{fontSize:32,fontWeight:900,color:props.valColor||TEXT,fontFamily:FONT_DISPLAY,whiteSpace:"nowrap",margin:"8px 0",letterSpacing:"-0.5px",lineHeight:1}}>{props.value}</div>
    <div style={{fontSize:10,color:MUTED,fontFamily:FONT_BODY,minHeight:12,letterSpacing:"0.3px"}}>{props.sub||"\u00A0"}</div>
  </div>);
}

    const g = CHURN_GOALS[n];
    acc.q1Churns += g.q1;
    acc.q2Budget += g.budget;
    acc.q2Total += g.q2;
    acc.aprChurns += g.apr;
    acc.marChurns += g.mar;
    acc.aprAccts += g.aprAccts;
    acc.aprFlips += g.aprFlips;
    if(g.mtgPct >= 100) acc.goalMet++;
    else if(g.mtgPct >= 75) acc.nearGoal++;
    if(g.q1 > 0) acc.withBaseline++;
    return acc;
  }, {q1Churns:0, q2Budget:0, q2Total:0, aprChurns:0, marChurns:0, aprAccts:0, aprFlips:0, goalMet:0, nearGoal:0, withBaseline:0});

// ─── SALES REPS LEADERBOARD ───────────────────────────────────────────────
function RepLeaderboard({onSelect}){
  // Apr 15 ranking (30-day window 3/16 → 4/15/2026) — third data point for rank streak detection
  const MAR15_RANKS = {
    "Dominic Libertoski":1, "Kellee Madonia":2, "Jesse Shorr":3, "Joshua Bylsma":4, "Eric Tuttle":5, "Alyssa Perez":6, "Harjit Sawhney":7, "Anand Pandey":8, "Blake Peremel":9, "Tim Lan":10, "Ariel Wolfe":11, "Cesar Garcia":12, "Rebecca Barnes":13, "Paige Givinsky":14, "Derek Sindelman":15, "Stephanie Hackert":16, "Michele Harris":17, "Francois Dore":18, "Bill O'Leary":19, "Logan Kennedy":20, "Korbin Kirk":21, "Daniel Davies":22, "Joshua Crawford":23, "Alli Fowler":24, "Johan Vrey":25, "Savannah Peck":26, "Javion Jones":27, "Anthony Allen":28, "Mark Kreidler":29, "Elisha Johnson":30
  };

  const ranked = Object.entries(REP_PACE)
    .filter(([name,p]) => p.aprRank != null)
    .map(([name,p]) => {
      const moved = p.marchRank != null ? (p.marchRank - p.aprRank) : null;
      // Rank streak across last 3 published rankings: Apr 15, May 15 (marchRank slot), Jul 15 (aprRank slot) — no June report
      const marR = MAR15_RANKS[name] ?? null;
      const aprR = p.marchRank;
      const mayR = p.aprRank;
      const allThree = marR!=null && aprR!=null && mayR!=null;
      // Tier the streak by consistency
      let streakTier = null;          // null = no streak
      let streakLabel = "";
      if (allThree) {
        if (marR === aprR && aprR === mayR) {
          streakTier = "lock";
          streakLabel = `LOCKED #${mayR} · 3 RANKINGS`;
        } else if (marR<=3 && aprR<=3 && mayR<=3) {
          streakTier = "top3";
          streakLabel = "TOP 3 · 3 RANKINGS";
        } else if (marR<=5 && aprR<=5 && mayR<=5) {
          streakTier = "top5";
          streakLabel = "TOP 5 · 3 RANKINGS";
        } else if (marR<=10 && aprR<=10 && mayR<=10) {
          streakTier = "top10";
          streakLabel = "TOP 10 · 3 RANKINGS";
        }
      }
      return {
        name,
        aprRank: p.aprRank,
        marchRank: p.marchRank,
        curMQL: p.curMQL || 0,
        curSQL: p.curSQL || 0,
        curMtg: p.curMtg || 0,
        streakTier,
        streakLabel,
        marR, aprR, mayR,
        moved,
      };
    })
    .sort((a,b) => a.aprRank - b.aprRank);
  
  // Outstanding increases: booked meetings, current period (7/16-8/15) vs prior period (6/16-7/15)
  const gainers = ranked
    .map(r => {
      const p = REP_PACE[r.name];
      const prevMtg = r.marchRank != null ? (p.marchFlips || 0) : null;
      const delta = prevMtg != null ? r.curMtg - prevMtg : null;
      return {...r, prevMtg, delta, isNew: r.marchRank == null && r.curMtg > 0};
    })
    .filter(r => (r.delta != null && r.delta > 0) || (r.isNew && r.curMtg >= 5))
    .sort((a,b) => ((b.delta ?? b.curMtg) - (a.delta ?? a.curMtg)))
    .slice(0, 6);
  const totCurMtg = ranked.reduce((s,r)=>s+(r.curMtg||0),0);
  const totPrevMtg = ranked.reduce((s,r)=>{const p=REP_PACE[r.name];return s+((r.marchRank!=null?p.marchFlips:0)||0);},0);
  const teamMtgDelta = totCurMtg - totPrevMtg;
  const teamMtgPct = totPrevMtg>0 ? Math.round((teamMtgDelta/totPrevMtg)*100) : null;

  const NON_RANKED = [
    {name:"Unattributed & departed reps", note:"No rep on the row, or logged by someone no longer with Martal", mql:11, sql:9, mtg:1},
  ];

  const topThree = ranked.slice(0, 3);
  const rest = ranked.slice(3);
  
  const rankColor = (r) => r === 1 ? G_TEXT : r === 2 ? "#4D4D51" : r === 3 ? "#6B6B70" : MUTED;
  const rankBg = (r) => r === 1 ? "linear-gradient(135deg, #E2EFC7 0%, rgba(255,255,255,.72) 60%)" : r === 2 ? "linear-gradient(135deg, #E9E9EB 0%, rgba(255,255,255,.72) 60%)" : r === 3 ? "linear-gradient(135deg, #F4F4F5 0%, rgba(255,255,255,.72) 60%)" : CARD;
  
  const moveIndicator = (moved) => {
    if (moved == null) return null;
    if (moved > 0) return {arrow:"↑", color:"#80B122", text:"+"+moved};
    if (moved < 0) return {arrow:"↓", color:"#B43232", text:""+moved};
    return {arrow:"↔", color:MUTED, text:"—"};
  };

  // Streak badge styling by tier
  const streakStyle = (tier) => {
    if (tier === "lock")  return {bg:"#FBF3DD",border:"#E5A000",col:"#B7791F",fire:"🔥🔥🔥"};
    if (tier === "top3")  return {bg:"#FBF3DD",border:"rgba(229,160,0,.70)",col:"#B7791F",fire:"🔥🔥"};
    if (tier === "top5")  return {bg:"#FBF3DD",border:"rgba(229,160,0,.45)",col:"#B7791F",fire:"🔥"};
    if (tier === "top10") return {bg:"#FAFAFA",border:"#D6D6D9",col:"#6B6B70",fire:"🔥"};
    return null;
  };
  
  return (<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div>
        <div style={{fontSize:26,fontWeight:900,color:TEXT,fontFamily:FONT_DISPLAY,letterSpacing:"-0.8px"}}>Sales Rep <span style={{color:G_TEXT}}>Leaderboard</span></div>
        <div style={{fontSize:12,color:MUTED,fontFamily:FONT_BODY,marginTop:4}}>Final Rankings — 30-day period 7/16–8/15/2026, closed · Campaign dashboard FLIP counts · Click a rep to view their full dashboard</div>
      </div>
      <div style={{fontSize:11,color:MUTED,fontFamily:FONT_BODY,letterSpacing:"1.2px",textTransform:"uppercase"}}>{ranked.length} ranked reps</div>
    </div>

    {/* Outstanding increases banner */}
    {gainers.length>0 && (
    <div style={{background:"linear-gradient(135deg, #F2F7E6 0%, rgba(255,255,255,.62) 65%)",border:"1px solid #FBF3DD",borderLeft:"3px solid #E5A000",borderRadius:10,padding:"14px 18px",marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:800,color:"#E5A000",fontFamily:FONT_BODY,letterSpacing:"1.5px",textTransform:"uppercase"}}>🚀 Outstanding Increases — Booked Meetings vs Prior Period (6/16–7/15)</div>
        <div style={{fontSize:11,color:MUTED,fontFamily:FONT_BODY}}>Ranked reps: <span style={{color:G,fontWeight:800}}>{totCurMtg}</span> vs {totPrevMtg} in the prior period{teamMtgPct!=null && <span style={{color:G,fontWeight:800}}> · +{teamMtgDelta} ({teamMtgPct>0?"+":""}{teamMtgPct}%)</span>} · Team total incl. unattributed: 392 (final)</div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {gainers.map(g=>(
          <div key={g.name} onClick={()=>onSelect(g.name)} style={{background:CARD2,border:"1px solid "+BORDER,borderRadius:8,padding:"8px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
            <div>
              <div style={{fontSize:12,fontWeight:800,color:TEXT,fontFamily:FONT_DISPLAY}}>{g.name}</div>
              <div style={{fontSize:10,color:MUTED,fontFamily:FONT_BODY,marginTop:1}}>{g.isNew?"first ranked period":`${g.prevMtg} → ${g.curMtg} meetings`}</div>
            </div>
            <div style={{fontSize:16,fontWeight:900,color:"#80B122",fontFamily:FONT_DISPLAY}}>{g.isNew?`${g.curMtg} NEW`:`+${g.delta}`}</div>
          </div>
        ))}
      </div>
    </div>)}

    {/* Top 3 podium */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))",gap:12,marginBottom:20}}>
      {topThree.map(r => {
        const mv = moveIndicator(r.moved);
        const ss = streakStyle(r.streakTier);
        return (<div key={r.name} onClick={()=>onSelect(r.name)} style={{background:rankBg(r.aprRank),border:"1px solid "+BORDER,borderLeft:"3px solid "+rankColor(r.aprRank),borderRadius:10,padding:"20px 22px",cursor:"pointer",position:"relative",overflow:"hidden",transition:"transform 0.15s",minHeight:160}}
          onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"}
          onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <div style={{fontSize:48,fontWeight:900,color:rankColor(r.aprRank),fontFamily:FONT_DISPLAY,lineHeight:0.9,letterSpacing:"-2px"}}>#{r.aprRank}</div>
              {ss && (
                <div title={`Rank history (Apr/May/Jul): #${r.marR} → #${r.aprR} → #${r.mayR}`} style={{background:ss.bg,border:`1px solid ${ss.border}`,color:ss.col,borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:800,fontFamily:FONT_BODY,letterSpacing:"0.5px",display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
                  {ss.fire} {r.streakLabel}

              )}
            </div>
            {mv && (<div style={{color:mv.color,fontSize:13,fontWeight:800,fontFamily:FONT_DISPLAY}}>{mv.arrow} {mv.text}</div>)}
          </div>
          <div style={{fontSize:20,fontWeight:800,color:TEXT,fontFamily:FONT_DISPLAY,marginBottom:12,letterSpacing:"-0.3px"}}>{r.name}</div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {[["MQLs",r.curMQL,G],["SQLs",r.curSQL,"#1A6A98"],["MEETINGS",r.curMtg,"#185773"]].map(([l,v,c]) => (
              <div key={l}>
                <div style={{fontSize:8,color:MUTED,fontFamily:FONT_BODY,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase"}}>{l}</div>
                <div style={{fontSize:22,fontWeight:900,color:c,fontFamily:FONT_DISPLAY,lineHeight:1,letterSpacing:"-0.5px"}}>{v}</div>
              </div>
            ))}
          </div>
        </div>);
      })}
    </div>
    
    {/* Rest of leaderboard */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(260px, 1fr))",gap:8}}>
      {rest.map(r => {
        const mv = moveIndicator(r.moved);
        const ss = streakStyle(r.streakTier);
        return (<div key={r.name} onClick={()=>onSelect(r.name)} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:8,padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"transform 0.15s"}}

            <div style={{fontSize:12,fontWeight:700,color:TEXT,fontFamily:FONT_DISPLAY,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.name}{ss&&<span title={`Rank history Apr→May→Jul: #${r.marR} → #${r.aprR} → #${r.mayR}`} style={{marginLeft:6,fontSize:11}}>{ss.fire}</span>}</div>
            <div style={{fontSize:10,color:MUTED,fontFamily:FONT_BODY,marginTop:2}}>
              <span style={{color:G_TEXT}}>{r.curMQL}</span>M &nbsp;
              <span style={{color:"#1A6A98"}}>{r.curSQL}</span>S &nbsp;

          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>

      <select value={sel} onChange={e=>setSel(e.target.value)} style={{width:"100%",maxWidth:400,background:CARD2,color:TEXT,border:`1px solid ${BORDER2}`,borderRadius:4,padding:"9px 14px",fontSize:14,fontFamily:FONT_BODY,outline:"none"}}>

        {visibleReps.map(r=><option key={r} value={r}>{r}</option>)}
      </select>
    </div>
    {sel?(<div>
      <div style={{marginBottom:8,paddingBottom:12,borderBottom:`1px solid ${BORDER}`}}>
        <div style={{color:TEXT,fontSize:20,fontWeight:800,letterSpacing:"-0.5px",fontFamily:FONT_DISPLAY}}>{sel}</div>
        <div style={{color:MUTED,fontSize:11,marginTop:4,fontFamily:FONT_BODY}}>
          Sales Rep &nbsp;·&nbsp;
          <span style={{color:G,fontWeight:700}}>{accs.filter(a=>!a.end).length}</span> active accounts
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <button
          onClick={()=>setPrinting(true)}
          style={{background:G,color:'#fff',border:'none',borderRadius:6,padding:'10px 24px',fontSize:12,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',cursor:'pointer',fontFamily:FONT_BODY,display:'inline-flex',alignItems:'center',gap:8,boxShadow:'0 2px 6px rgba(128,177,34,0.35)'}}>
          🖨&nbsp; Export PDF for {sel.split(' ')[0]}
        </button>
        <span style={{marginLeft:12,fontSize:11,color:MUTED,fontFamily:FONT_BODY}}>Opens a print-ready view — use Ctrl+P / ⌘+P to save as PDF</span>
      </div>
      {accs.length>0?(
        <PersonCharts accounts={accs} perf={null} repName={sel}/>
      ):(
        <div>
          <PacePanel repName={sel}/>
          <div style={{...CS,color:MUTED,fontSize:13,fontFamily:FONT_BODY}}>
            No account assignments found for this rep in the current data.
          </div>
        </div>
      )}
    </div>):(
      <RepLeaderboard onSelect={setSel}/>
    )}
  </div>);
}


// ─── SDR PERFORMANCE DASHBOARD TAB ───────────────────────────────────────────
const SDR_DARK="transparent",SDR_CARD=CARD,SDR_CARD2=CARD3,SDR_BORDER=BORDER;
const SDR_TEXT="#181818",SDR_MUTED="#4D4D51",SDR_GREEN="#6B961C",SDR_YELLOW="#B7791F";
const SDR_RED="#B43232",SDR_BLUE="#1A6A98",SDR_PURPLE="#185773";
const MTG_TARGET=8.5;
function sdrScore(rep,period="prev"){
  const mtg=period==="prev"?(rep.marchFlips||0):(rep.curMtg||0);
  const sql=period==="prev"?(rep.marchSQL||0):(rep.curSQL||0);
  return Math.round(((mtg/MTG_TARGET)*2.4+(sql/12)*1.0)*10)/10;
}
const SDR_PASS=3.5,SDR_ACT=3.0;
const SDR_REPS=Object.entries(REP_PACE).map(([name,p])=>({name,marchRank:p.marchRank,marchFlips:p.marchFlips,marchSQL:p.marchSQL,marchMQL:p.marchMQL,curMtg:p.curMtg,curSQL:p.curSQL,curMQL:p.curMQL}));
function sdrBand(s){return s>=SDR_PASS?"pass":s>=SDR_ACT?"observe":"below";}
function bandCol(b){return b==="pass"?SDR_GREEN:b==="observe"?SDR_YELLOW:SDR_RED;}

function SDRDashboard({cms}){
  const [subTab,setSubTab]=useState("overview");
  const [period,setPeriod]=useState("prev");
  const [filter,setFilter]=useState("all");
  const [sortBy,setSortBy]=useState("score");
  const [selRep,setSelRep]=useState(null);
  const DC={background:SDR_CARD,border:`1px solid ${SDR_BORDER}`,borderRadius:8,padding:"16px 20px"};
  const PERIOD_LABEL=period==="prev"?"Jun 16 – Jul 15, 2026":"Jul 16 – Aug 15, 2026";
  const repsWithScore=SDR_REPS.map(r=>({...r,score:sdrScore(r,period),actScore:SDR_ACT,mtg:period==="prev"?(r.marchFlips||0):(r.curMtg||0),sql:period==="prev"?(r.marchSQL||0):(r.curSQL||0),mql:period==="prev"?(r.marchMQL||0):(r.curMQL||0)})).map(r=>({...r,band:sdrBand(r.score)}));
  const pass=repsWithScore.filter(r=>r.band==="pass").length;
  const observe=repsWithScore.filter(r=>r.band==="observe").length;
  const below=repsWithScore.filter(r=>r.band==="below").length;
  const avgScore=(repsWithScore.reduce((s,r)=>s+r.score,0)/repsWithScore.length).toFixed(2);
  const teamMtg=repsWithScore.reduce((s,r)=>s+r.mtg,0);
  const teamSQL=repsWithScore.reduce((s,r)=>s+r.sql,0);
  const teamMQL=repsWithScore.reduce((s,r)=>s+r.mql,0);
  const filtered=repsWithScore.filter(r=>filter==="all"||r.band===filter);
  const sorted=[...filtered].sort((a,b)=>sortBy==="score"?b.score-a.score:sortBy==="mtg"?b.mtg-a.mtg:sortBy==="sql"?b.sql-a.sql:b.mql-a.mql);
  const SUBTABS=["overview","current month","score trends","heatmap","pacing","rep detail"];

  if(cms?.widgets?.pipeline===false) return <div style={{color:MUTED,padding:40,textAlign:"center"}}>SDR tab hidden via CMS.</div>;

  return(
    <div style={{background:SDR_DARK,borderRadius:10,padding:24,marginTop:-8}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <div>
          <div style={{fontSize:22,fontWeight:800,color:SDR_TEXT,fontFamily:FONT_DISPLAY}}>SDR Performance Dashboard</div>
          <div style={{fontSize:12,color:SDR_MUTED,marginTop:4,fontFamily:FONT_BODY}}>
            {period==="prev"?"Jun 16 – Jul 15, 2026 · last completed period":"Jul 16 – Aug 15, 2026 · current period"} · Current month: {PERIOD_LABEL}
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[["pass",`Pass · ${pass}`,SDR_GREEN],["observe",`Observe · ${observe}`,SDR_YELLOW],["below",`Below · ${below}`,SDR_RED]].map(([id,label,col])=>(
            <div key={id} style={{background:col+"22",border:`1px solid ${col}55`,color:col,borderRadius:20,padding:"5px 16px",fontSize:12,fontWeight:700,fontFamily:FONT_BODY}}>{id==="pass"?"✓":id==="observe"?"⚠":"●"} {label}</div>
          ))}
        </div>
      </div>

      {/* Stat cards */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",margin:"16px 0"}}>
        {[["AVG TEAM SCORE",avgScore,SDR_BLUE,"May rolling avg"],["PASS",pass,SDR_GREEN,"≥ 3.5 perf & 3.0 act"],["OBSERVE",observe,SDR_YELLOW,"One metric below"],["BELOW",below,SDR_RED,"Both metrics below"],["TEAM MEETINGS",teamMtg,SDR_PURPLE,`${teamSQL} SQLs · ${teamMQL} MQLs this period`]].map(([l,v,c,sub])=>(
          <div key={l} style={{...DC,flex:1,minWidth:120}}>
            <div style={{fontSize:9,color:SDR_MUTED,fontWeight:700,letterSpacing:"1.2px",textTransform:"uppercase",fontFamily:FONT_BODY,marginBottom:8}}>{l}</div>
            <div style={{fontSize:28,fontWeight:900,color:c,fontFamily:FONT_DISPLAY,lineHeight:1}}>{v}</div>
            <div style={{fontSize:10,color:SDR_MUTED,marginTop:6,fontFamily:FONT_BODY}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* Info banner */}
      <div style={{background:"#E8F4FC",border:"1px solid rgba(45,156,219,.28)",borderRadius:6,padding:"10px 16px",marginBottom:16,display:"flex",gap:10,alignItems:"center"}}>
        <div style={{width:10,height:10,background:SDR_BLUE,borderRadius:2,flexShrink:0}}/>
        <div style={{fontSize:12,color:SDR_MUTED,fontFamily:FONT_BODY}}>Activity score shows <strong style={{color:SDR_TEXT}}>3.0 for all reps</strong> — placeholder in source report. All reps currently meeting the 3.0 activity threshold.</div>
      </div>

      {/* Filter + period */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:16}}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:SDR_MUTED,fontFamily:FONT_BODY}}>FILTER:</span>
          {[["all","All Reps",SDR_TEXT],["pass",`Pass (${pass})`,SDR_GREEN],["observe",`Observe (${observe})`,SDR_YELLOW],["below",`Below (${below})`,SDR_RED]].map(([id,label,col])=>(
            <button key={id} onClick={()=>setFilter(id)} style={{padding:"5px 14px",fontSize:11,fontWeight:700,border:`1px solid ${filter===id?col:SDR_BORDER}`,background:filter===id?col+"22":"transparent",color:filter===id?col:SDR_MUTED,borderRadius:20,cursor:"pointer",fontFamily:FONT_BODY}}>{label}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:4}}>
          {[["prev","Apr 16 – May 15"],["cur","Jun 16 – Jul 15"]].map(([id,label])=>(
            <button key={id} onClick={()=>setPeriod(id)} style={{padding:"5px 12px",fontSize:11,fontWeight:700,border:`1px solid ${period===id?SDR_BLUE:SDR_BORDER}`,background:period===id?SDR_BLUE+"22":"transparent",color:period===id?SDR_BLUE:SDR_MUTED,borderRadius:4,cursor:"pointer",fontFamily:FONT_BODY}}>{label}</button>
          ))}
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",borderBottom:`1px solid ${SDR_BORDER}`,marginBottom:20,gap:0}}>
        {SUBTABS.map(t=>(
          <button key={t} onClick={()=>setSubTab(t)} style={{padding:"8px 16px",background:"transparent",border:"none",borderBottom:subTab===t?`2px solid ${SDR_BLUE}`:"2px solid transparent",color:subTab===t?SDR_BLUE:SDR_MUTED,fontSize:12,fontWeight:subTab===t?700:400,cursor:"pointer",fontFamily:FONT_BODY,textTransform:"capitalize"}}>{t}</button>
        ))}
      </div>

      {/* OVERVIEW */}
      {subTab==="overview"&&(
        <div>
          <div style={{fontSize:12,color:SDR_MUTED,marginBottom:12,fontFamily:FONT_BODY}}>
            {period==="prev"?"May 2026 report (Apr 16–May 15)":"Jun 16–Jul 15 period score"} · dashed = 3.5 threshold · click bar → Rep Detail
          </div>
          <div style={{...DC}}>
            <div style={{overflowX:"auto"}}>
              <div style={{minWidth:Math.max(700,sorted.length*38),position:"relative",height:240}}>
                {[0,2,4,6,8,10,12].map(v=>{const y=195-(v/13)*175;return(<g key={v}><div style={{position:"absolute",top:y,left:28,right:8,borderTop:`1px dashed ${SDR_BORDER}`}}/>
                  <span style={{position:"absolute",top:y-6,left:0,fontSize:9,color:SDR_MUTED,fontFamily:FONT_BODY}}>{v}</span></g>);})}
                <div style={{position:"absolute",top:195-(SDR_PASS/13)*175,left:28,right:8,borderTop:`1.5px dashed ${SDR_YELLOW}`,zIndex:2}}>
                  <span style={{position:"absolute",right:0,top:-14,fontSize:9,color:SDR_YELLOW,fontWeight:700,fontFamily:FONT_BODY}}>3.5 pass</span>
                </div>
                <div style={{position:"absolute",top:195-(SDR_ACT/13)*175,left:28,right:8,borderTop:`1px dashed ${SDR_MUTED}`,zIndex:2}}>
                  <span style={{position:"absolute",right:0,top:-13,fontSize:9,color:SDR_MUTED,fontFamily:FONT_BODY}}>3.0 activity</span>
                </div>
                <div style={{position:"absolute",top:0,left:28,right:8,bottom:28,display:"flex",alignItems:"flex-end",gap:2}}>
                  {sorted.map((r)=>{
                    const h=Math.max(2,(Math.min(r.score,13)/13)*175);
                    const col=bandCol(r.band);
                    return(<div key={r.name} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%",cursor:"pointer"}} onClick={()=>{setSelRep(r.name);setSubTab("rep detail");}}>
                      <div style={{width:"82%",height:h,background:col,borderRadius:"2px 2px 0 0"}} onMouseEnter={e=>e.currentTarget.style.opacity="0.7"} onMouseLeave={e=>e.currentTarget.style.opacity="1"} title={`${r.name}: ${r.score}`}/>
                    </div>);
                  })}
                </div>
                <div style={{position:"absolute",bottom:0,left:28,right:8,display:"flex",gap:2,height:26}}>
                  {sorted.map((r)=>(
                    <div key={r.name} style={{flex:1,overflow:"hidden",display:"flex",justifyContent:"center"}}>
                      <span style={{fontSize:7,color:SDR_MUTED,fontFamily:FONT_BODY,transform:"rotate(-40deg)",transformOrigin:"top center",whiteSpace:"nowrap",display:"block",marginTop:4}}>
                        {r.name.split(" ").map((w,i)=>i===0?w[0]+".":w[0]).join("")}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* CURRENT MONTH */}
      {subTab==="current month"&&(
        <div>
          <div style={{fontSize:12,color:SDR_MUTED,marginBottom:12,fontFamily:FONT_BODY}}>{PERIOD_LABEL} · Pipeline Activity</div>
          <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
            {[["TEAM MQLs",teamMQL,SDR_PURPLE],["TEAM SQLs",teamSQL,SDR_BLUE],["TEAM MEETINGS",teamMtg,SDR_GREEN]].map(([l,v,c])=>(
              <div key={l} style={{...DC,flex:1,minWidth:140,textAlign:"center"}}>
                <div style={{fontSize:9,color:SDR_MUTED,fontWeight:700,letterSpacing:"1.2px",textTransform:"uppercase",fontFamily:FONT_BODY,marginBottom:6}}>{l}</div>
                <div style={{fontSize:30,fontWeight:900,color:c,fontFamily:FONT_DISPLAY}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:12,alignItems:"center"}}>
            <span style={{fontSize:11,color:SDR_MUTED,fontFamily:FONT_BODY}}>Sort by:</span>
            {[["mtg","Meetings"],["sql","SQLs"],["mql","MQLs"],["score","Score"]].map(([id,label])=>(
              <button key={id} onClick={()=>setSortBy(id)} style={{padding:"4px 10px",fontSize:11,fontWeight:700,border:`1px solid ${sortBy===id?SDR_BLUE:SDR_BORDER}`,background:sortBy===id?SDR_BLUE+"22":"transparent",color:sortBy===id?SDR_BLUE:SDR_MUTED,borderRadius:4,cursor:"pointer",fontFamily:FONT_BODY}}>{label}</button>
            ))}
          </div>
          <div style={{...DC}}>
            <div style={{fontSize:10,color:SDR_MUTED,marginBottom:12,fontFamily:FONT_BODY}}>MEETINGS BOOKED — {PERIOD_LABEL}</div>
            <div style={{overflowX:"auto"}}>
              <div style={{minWidth:Math.max(700,sorted.length*38),position:"relative",height:220}}>
                {[0,8,16,24,32].map(v=>{const maxV=Math.max(...sorted.map(r=>r.mtg),1);const y=180-(v/Math.max(maxV,32))*160;return(<div key={v} style={{position:"absolute",top:y,left:28,right:8,borderTop:`1px dashed ${SDR_BORDER}`}}><span style={{position:"absolute",left:-26,fontSize:9,color:SDR_MUTED,fontFamily:FONT_BODY}}>{v}</span></div>);})}
                <div style={{position:"absolute",top:180-(15/Math.max(Math.max(...sorted.map(r=>r.mtg),1),32))*160,left:28,right:8,borderTop:`1.5px dashed ${SDR_GREEN}`,zIndex:2}}>
                  <span style={{position:"absolute",right:0,top:-14,fontSize:9,color:SDR_GREEN,fontWeight:700,fontFamily:FONT_BODY}}>15 target</span>
                </div>
                <div style={{position:"absolute",top:0,left:28,right:8,bottom:28,display:"flex",alignItems:"flex-end",gap:2}}>
                  {sorted.map((r)=>{const maxV=Math.max(...sorted.map(r=>r.mtg),1);const h=Math.max(2,(r.mtg/Math.max(maxV,32))*160);const col=bandCol(r.band);return(<div key={r.name} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}><div style={{width:"82%",height:h,background:col,borderRadius:"2px 2px 0 0"}} title={`${r.name}: ${r.mtg}`}/></div>);})}
                </div>
                <div style={{position:"absolute",bottom:0,left:28,right:8,display:"flex",gap:2,height:26}}>
                  {sorted.map((r)=>(<div key={r.name} style={{flex:1,display:"flex",justifyContent:"center"}}><span style={{fontSize:7,color:SDR_MUTED,fontFamily:FONT_BODY,transform:"rotate(-40deg)",transformOrigin:"top center",whiteSpace:"nowrap",display:"block",marginTop:4}}>{r.name.split(" ").map((w,i)=>i===0?w[0]+".":w[0]).join("")}</span></div>))}
                </div>
              </div>
            </div>
          </div>
          {/* Rep table */}
          <div style={{...DC,marginTop:12}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,fontFamily:FONT_BODY}}>
              <thead><tr style={{borderBottom:`1px solid ${SDR_BORDER}`}}>{["REP","MQL","SQL","MEETINGS","MTG BAND","MAY AVG SCORE","TIER"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:h==="REP"?"left":"center",color:SDR_MUTED,fontWeight:700,fontSize:9,textTransform:"uppercase",letterSpacing:"1px"}}>{h}</th>)}</tr></thead>
              <tbody>{sorted.map((r,i)=>{const col=bandCol(r.band);return(<tr key={r.name} style={{borderBottom:`1px solid ${SDR_BORDER}22`,background:i%2?SDR_CARD2:"transparent"}}>
                <td style={{padding:"7px 10px",color:SDR_TEXT,fontWeight:600}}>{r.name}</td>
                <td style={{padding:"7px 10px",textAlign:"center",color:SDR_PURPLE,fontWeight:600}}>{r.mql}</td>
                <td style={{padding:"7px 10px",textAlign:"center",color:SDR_BLUE,fontWeight:600}}>{r.sql}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontWeight:700,color:col}}>{r.mtg}</td>
                <td style={{padding:"7px 10px",textAlign:"center"}}><span style={{background:col+"22",color:col,border:`1px solid ${col}44`,borderRadius:3,padding:"2px 8px",fontSize:10,fontWeight:700}}>{r.band.toUpperCase()}</span></td>
                <td style={{padding:"7px 10px",textAlign:"center",fontWeight:700,color:col}}>{r.score.toFixed(1)}</td>
                <td style={{padding:"7px 10px",textAlign:"center",color:SDR_MUTED,fontSize:11}}>{r.marchRank!=null?`#${r.marchRank}`:"New"}</td>
              </tr>);})}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* SCORE TRENDS */}
      {subTab==="score trends"&&(
        <div>
          <div style={{fontSize:12,color:SDR_MUTED,marginBottom:12,fontFamily:FONT_BODY}}>Performance score trend — previous period vs current period</div>
          <div style={{...DC}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,fontFamily:FONT_BODY}}>
              <thead><tr style={{borderBottom:`1px solid ${SDR_BORDER}`}}>{["Rep","Mar Rank","Score (Feb–Mar)","Score (Mar–Apr)","Trend","Band"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:h==="Rep"?"left":"center",color:SDR_MUTED,fontWeight:700,fontSize:9,textTransform:"uppercase",letterSpacing:"1px"}}>{h}</th>)}</tr></thead>
              <tbody>{[...repsWithScore].sort((a,b)=>sdrScore(b,"prev")-sdrScore(a,"prev")).map((r,i)=>{
                const prevS=sdrScore(r,"prev"),curS=sdrScore(r,"cur"),delta=curS-prevS,col=bandCol(sdrBand(prevS));
                return(<tr key={r.name} style={{borderBottom:`1px solid ${SDR_BORDER}22`,background:i%2?SDR_CARD2:"transparent"}}>
                  <td style={{padding:"8px 10px",color:SDR_TEXT,fontWeight:600,cursor:"pointer"}} onClick={()=>{setSelRep(r.name);setSubTab("rep detail");}}>{r.name}</td>
                  <td style={{padding:"8px 10px",textAlign:"center",color:SDR_MUTED,fontSize:11}}>{r.marchRank!=null?`#${r.marchRank}`:"New"}</td>
                  <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:bandCol(sdrBand(prevS))}}>{prevS.toFixed(1)}</td>
                  <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:bandCol(sdrBand(curS))}}>{curS.toFixed(1)}</td>
                  <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:delta>0?SDR_GREEN:delta<0?SDR_RED:SDR_MUTED}}>{delta>0?`↑ +${delta.toFixed(1)}`:delta<0?`↓ ${delta.toFixed(1)}`:"→"}</td>
                  <td style={{padding:"8px 10px",textAlign:"center"}}><span style={{background:col+"22",color:col,border:`1px solid ${col}44`,borderRadius:3,padding:"2px 8px",fontSize:10,fontWeight:700}}>{sdrBand(prevS).toUpperCase()}</span></td>
                </tr>);
              })}</tbody>
            </table>
          </div>
        </div>
      )}

      {/* HEATMAP */}
      {subTab==="heatmap"&&(
        <div>
          <div style={{fontSize:12,color:SDR_MUTED,marginBottom:12,fontFamily:FONT_BODY}}>MQL × SQL × Meetings intensity — {PERIOD_LABEL}</div>
          <div style={{...DC,overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:FONT_BODY}}>
              <thead><tr style={{borderBottom:`1px solid ${SDR_BORDER}`}}>{["Rep","MQLs","","SQLs","","Meetings","","Score","Band"].map((h,i)=><th key={i} style={{padding:"8px 8px",textAlign:h==="Rep"?"left":"center",color:SDR_MUTED,fontWeight:700,fontSize:9,textTransform:"uppercase",letterSpacing:"1px",minWidth:h===""?70:undefined}}>{h}</th>)}</tr></thead>
              <tbody>{[...repsWithScore].sort((a,b)=>b.score-a.score).map((r,i)=>{
                const mqlMax=Math.max(...repsWithScore.map(x=>x.mql),1),sqlMax=Math.max(...repsWithScore.map(x=>x.sql),1),mtgMax=Math.max(...repsWithScore.map(x=>x.mtg),1);
                const heat=(v,max)=>{const p=v/max;return p>0.75?"#98C246":p>0.5?"#B0D26C":p>0.25?"#D6E8AE":p>0.05?"#F2F7E6":"rgba(255,255,255,.5)";};
                const col=bandCol(r.band);
                return(<tr key={r.name} style={{borderBottom:`1px solid ${SDR_BORDER}22`,background:i%2?SDR_CARD2:"transparent"}}>
                  <td style={{padding:"6px 8px",color:SDR_TEXT,fontWeight:500,whiteSpace:"nowrap"}}>{r.name}</td>
                  <td style={{padding:"6px 8px",textAlign:"center",color:SDR_PURPLE,fontWeight:600}}>{r.mql}</td>
                  <td style={{padding:"3px 4px"}}><div style={{height:14,background:heat(r.mql,mqlMax),borderRadius:2,width:`${Math.max((r.mql/mqlMax)*70,4)}px`,minWidth:4}}/></td>
                  <td style={{padding:"6px 8px",textAlign:"center",color:SDR_BLUE,fontWeight:600}}>{r.sql}</td>
                  <td style={{padding:"3px 4px"}}><div style={{height:14,background:heat(r.sql,sqlMax),borderRadius:2,width:`${Math.max((r.sql/sqlMax)*70,4)}px`,minWidth:4}}/></td>
                  <td style={{padding:"6px 8px",textAlign:"center",color:SDR_GREEN,fontWeight:600}}>{r.mtg}</td>

      {/* REP DETAIL */}
      {subTab==="rep detail"&&(

          <select value={selRep||""} onChange={e=>setSelRep(e.target.value)} style={{background:SDR_CARD2,color:SDR_TEXT,border:`1px solid ${SDR_BORDER}`,borderRadius:4,padding:"8px 14px",fontSize:13,fontFamily:FONT_BODY,outline:"none",width:"100%",maxWidth:340,marginBottom:16}}>

            const r=repsWithScore.find(x=>x.name===selRep);if(!r)return null;
            const col=bandCol(r.band),prevS=sdrScore(r,"prev"),curS=sdrScore(r,"cur");
            return(<div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:16}}>

                  <div style={{fontSize:20,fontWeight:800,color:SDR_TEXT,fontFamily:FONT_DISPLAY}}>{r.name}</div>
                  <div style={{fontSize:11,color:SDR_MUTED,marginTop:4,fontFamily:FONT_BODY}}>{r.marchRank!=null?`March Rank #${r.marchRank}`:"New Rep"} · Activity score: 3.0</div>
                </div>
                <span style={{background:col+"22",color:col,border:`1px solid ${col}44`,borderRadius:6,padding:"8px 20px",fontSize:14,fontWeight:700,fontFamily:FONT_BODY}}>{r.band.toUpperCase()}</span>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
                {[["Score (Feb–Mar)",prevS.toFixed(1),bandCol(sdrBand(prevS))],["Score (Mar–Apr)",curS.toFixed(1),bandCol(sdrBand(curS))],["Mtg Feb–Mar",r.marchFlips??0,SDR_GREEN],["Mtg Mar–Apr",r.curMtg,SDR_GREEN],["SQL Feb–Mar",r.marchSQL??0,SDR_BLUE],["SQL Mar–Apr",r.curSQL,SDR_BLUE],["MQL Feb–Mar",r.marchMQL??0,SDR_PURPLE],["MQL Mar–Apr",r.curMQL,SDR_PURPLE]].map(([l,v,c])=>(
                  <div key={l} style={{...DC,flex:1,minWidth:110,textAlign:"center"}}>
                    <div style={{fontSize:8,color:SDR_MUTED,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",fontFamily:FONT_BODY,marginBottom:6}}>{l}</div>
                    <div style={{fontSize:22,fontWeight:800,color:c,fontFamily:FONT_DISPLAY}}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{...DC}}>
                <div style={{fontSize:10,color:SDR_MUTED,fontWeight:700,letterSpacing:"1.2px",textTransform:"uppercase",fontFamily:FONT_BODY,marginBottom:12}}>SCORING BREAKDOWN</div>
                {[["Performance Score (Apr–May)",prevS.toFixed(1),SDR_PASS,bandCol(sdrBand(prevS))],["Performance Score (Jun–Jul)",curS.toFixed(1),SDR_PASS,bandCol(sdrBand(curS))],["Activity Score","3.0",SDR_ACT,SDR_YELLOW]].map(([label,val,thresh,col])=>(
                  <div key={label} style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                      <span style={{fontSize:11,color:SDR_MUTED,fontFamily:FONT_BODY}}>{label}</span>
                      <span style={{fontSize:13,fontWeight:700,color:col,fontFamily:FONT_DISPLAY}}>{val} <span style={{fontSize:10,color:SDR_MUTED,fontWeight:400}}>/ threshold {thresh}</span></span>
                    </div>
                    <div style={{height:6,background:SDR_CARD2,borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${Math.min(100,(parseFloat(val)/8)*100)}%`,background:col,borderRadius:3}}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>);
          })()}
        </div>
      )}
    </div>
  );
}

function loadCMS(){
  try{
    const s=localStorage.getItem("martal_cms");
    if(!s) return DEFAULT_CMS;
    const cms=JSON.parse(s);
    // One-time migration: April 2026 close. Force-refresh stale churn lock + meta.
    if(cms?.churn?.lockedMonth==="Mar 26"||cms?.churn?.lockedValue==="9.62"){
      cms.churn.lockedValue="12.15";
      cms.churn.lockedMonth="Apr 26";
      cms.churn.lockedLabel="Previous Month Churn (April 2026)";
      if(cms.meta) cms.meta.lastUpdated="May 4, 2026";
      try{localStorage.setItem("martal_cms",JSON.stringify(cms));}catch{}
    }
    // One-time migration: July 2026 close. Force-refresh stale churn lock.
    if(cms?.churn?.lockedMonth==="Apr 26"||cms?.churn?.lockedValue==="12.15"){
      cms.churn.lockedValue="20.52";
      cms.churn.lockedMonth="Jul 26";
      cms.churn.lockedLabel="Previous Month Churn (July 2026)";
      if(cms.meta) cms.meta.lastUpdated="August 14, 2026";
      try{localStorage.setItem("martal_cms",JSON.stringify(cms));}catch{}
    }
    // One-time migration: July 2026 ranking close. Refresh stale period meta.
    if(cms?.meta?.period==="Period 5/16–6/15/2026"){
      cms.meta.period="Period 6/16–7/15/2026";
      cms.meta.lastUpdated="July 15, 2026";
      try{localStorage.setItem("martal_cms",JSON.stringify(cms));}catch{}
    }
    // One-time migration: August 2026 ranking close. Refresh stale period meta.
    if(cms?.meta?.period==="Period 6/16–7/15/2026"){
      cms.meta.period="Period 7/16–8/15/2026";
      cms.meta.lastUpdated="August 15, 2026";
      try{localStorage.setItem("martal_cms",JSON.stringify(cms));}catch{}
    }
    return cms;
  }
  catch{return DEFAULT_CMS;}
}
