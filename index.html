// ─── COMPANY CHURN TAB (company-wide churn — month-end basis) ──────────────
function CompanyChurnTab(){
  const data = CD;
  const last = data[data.length-1];                 // May 26
  const denom = (data[data.length-2].ac + data[data.length-3].ac + data[data.length-4].ac)/3;
  const recent = data.slice(-18);
  const ytd = data.filter(d=>d.m.endsWith(" 26")).reduce((s,d)=>s+d.cl,0);
  const prevCr = data[data.length-2].cr;
  const crDelta = (last.cr!=null && prevCr!=null) ? +(last.cr-prevCr).toFixed(2) : null;

  // May churn by reason (from account-level data, end === "May 26")
  const mayCh = SOMS.flatMap(s=>s.accounts).filter(a=>a.end==="May 26");
  const rmap={};
  mayCh.forEach(a=>{const r=a.reason||"Uncategorized"; if(!rmap[r])rmap[r]={n:0,w:0}; rmap[r].n++; rmap[r].w+=(PEN[r]||1);});
  const reasons=Object.entries(rmap).map(([r,v])=>({r,n:v.n,w:v.w})).sort((a,b)=>b.w-a.w||b.n-a.n);
  const maxReasonN=Math.max(...reasons.map(x=>x.n),1);
  const totWeight=reasons.reduce((s,x)=>s+x.w,0);

  // Per-SOM May churn
  const somRows=Object.entries(CHURN_GOALS)
    .map(([name,g])=>({name:name.indexOf(" (")!==-1?name.split(" (")[0]:name, may:g.may||0, mayR:g.mayR||0, mayn:g.mayn||[], aprR:g.aprR}))
    .filter(x=>x.may>0).sort((a,b)=>b.may-a.may||b.mayR-a.mayR);

  const crColor=crCol(last.cr);

  // August 2026 — in-progress projection, NOT a closed month. As of Aug 15: 5 logged
  // cancels (confirmed against the live cancellations tracker, 15 Aug 2026) ÷ 15 elapsed
  // days × 31 days = projected total. Fold Aug into RAW as a real closed month once
  // September confirms it — that real number can't post before Sep 1.
  const projAugAsOfDay=15, projAugDaysInMonth=31, projAugLoggedSoFar=5, projAugDcSoFar=9;
  const projAugTotal=Math.round(projAugLoggedSoFar*projAugDaysInMonth/projAugAsOfDay);
  const projAugDc=18;
  const projAugActive=86;
  const projAugDenom=(data[data.length-1].ac+data[data.length-2].ac+data[data.length-3].ac)/3;
  const projAugRate=+((projAugTotal/projAugDenom)*100).toFixed(2);
  const recentWithProj=[...recent,{m:"Aug 26",ac:projAugActive,cl:projAugTotal,dc:projAugDc,cr:projAugRate,projected:true}];

  return (<div>
    {/* headline note */}
    <div style={{fontSize:11,color:MUTED,fontFamily:FONT_BODY,marginBottom:16,lineHeight:1.5}}>
      Churn rate = contracts lost ÷ trailing 3-month average of active clients. Calendar-month measure; performance metrics elsewhere run 16th-to-15th — different cadence by design.
    </div>

    {/* HERO — August projection leads. July is the baseline it beats. */}
    <div style={{border:`2px solid ${G}`,background:"#F2F7E6",borderRadius:12,padding:"22px 26px",marginBottom:14}}>
      <div style={{display:"flex",gap:28,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{minWidth:230}}>
          <div style={{fontSize:10,letterSpacing:"1.8px",textTransform:"uppercase",color:MUTED,fontFamily:FONT_BODY,fontWeight:800,marginBottom:6}}>August — Projected Churn</div>
          <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
            <div style={{fontSize:60,fontWeight:900,color:G,fontFamily:FONT_DISPLAY,letterSpacing:"-2px",lineHeight:1}}>{projAugRate}%</div>
            <div style={{fontSize:22,fontWeight:900,color:G,fontFamily:FONT_DISPLAY,letterSpacing:"-0.5px"}}>▼ {Math.abs(((projAugRate-last.cr)/last.cr)*100).toFixed(0)}%</div>
          </div>
          <div style={{fontSize:12,color:TEXT,fontFamily:FONT_BODY,marginTop:8,fontWeight:700}}>down from {last.cr}% in July</div>
        </div>
        <div style={{minWidth:210,borderLeft:`1px solid ${G}55`,paddingLeft:26}}>
          <div style={{fontSize:10,letterSpacing:"1.8px",textTransform:"uppercase",color:MUTED,fontFamily:FONT_BODY,fontWeight:800,marginBottom:6}}>August — Projected Deals Closed</div>
          <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
            <div style={{fontSize:60,fontWeight:900,color:"#1A6A98",fontFamily:FONT_DISPLAY,letterSpacing:"-2px",lineHeight:1}}>~{projAugDc}</div>
            <div style={{fontSize:22,fontWeight:900,color:G,fontFamily:FONT_DISPLAY,letterSpacing:"-0.5px"}}>▲ {(((projAugDc-last.dc)/last.dc)*100).toFixed(0)}%</div>
          </div>
          <div style={{fontSize:12,color:TEXT,fontFamily:FONT_BODY,marginTop:8,fontWeight:700}}>up {projAugDc-last.dc} on July's {last.dc}</div>
        </div>
        <div style={{flex:1,minWidth:280}}>
          <div style={{fontSize:19,fontWeight:900,color:TEXT,fontFamily:FONT_DISPLAY,letterSpacing:"-0.3px",lineHeight:1.3,marginBottom:8}}>
            Cancellations are running at <span style={{color:G}}>half of July's pace</span>.
          </div>
          <div style={{fontSize:13,color:MUTED,fontFamily:FONT_BODY,lineHeight:1.6}}>
            {projAugLoggedSoFar} cancels logged through Aug {projAugAsOfDay} — <span style={{color:TEXT,fontWeight:700}}>0.33 a day against July's 0.68, a 51% drop in pace</span>. That paces to ~{projAugTotal} for the month against {last.cl} in July, while new business goes the other way — <span style={{color:TEXT,fontWeight:700}}>~{projAugDc} deals closed against July's {last.dc}, up {(((projAugDc-last.dc)/last.dc)*100).toFixed(0)}%</span>. Fewer out, more in.
            <br/><span style={{color:TEXT,fontWeight:700}}>September 1 is when it becomes real</span> — the confirmed close can't post before then.
          </div>
        </div>
      </div>
    </div>

    {/* supporting numbers */}
    <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}}>
      <KpiCard label="AUG CANCELS SO FAR" value={projAugLoggedSoFar} sub={"through Aug "+projAugAsOfDay+" · ~"+projAugTotal+" projected"} valColor={G}/>
      <KpiCard label="JULY DEALS CLOSED" value={last.dc} sub={"vs "+data[data.length-2].dc+" in June · "+projAugDcSoFar+" logged so far in Aug"} valColor="#1A6A98"/>
      <KpiCard label="JULY CHURN RATE" value={last.cr!=null?last.cr+"%":"—"} sub={crDelta!=null?(crDelta>0?"▲ +":"▼ ")+crDelta+" pts vs June":"—"} valColor={crColor}/>
      <KpiCard label="JULY CANCELS" value={last.cl} sub={"vs "+data[data.length-2].cl+" in June"} valColor="#D64242"/>
      <KpiCard label="3-MO AVG ACTIVE (DENOM)" value={denom.toFixed(1)} sub="Apr / May / Jun active avg" valColor={TEXT}/>
      <KpiCard label="2026 YTD CANCELS" value={ytd} sub="Jan–Jul 2026, closed months" valColor="#E5A000"/>
    </div>

    {/* churn rate trend */}
    <div style={CS}>
      <SectionLabel>Company Churn Rate — Trailing 18 Months (month-end, Aug projected)</SectionLabel>
      <SvgBarChart data={recentWithProj} dataKey="cr" colorFn={crCol} xKey="m" yFmt={v=>`${v}%`} height={150}/>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:6}}>Green &lt;10% · yellow 10–15% · orange 15–20% · red ≥20%. July came in at {last.cr}% on {last.cl} cancellations. August (hatched) is a same-pace projection, not a closed month.</div>
    </div>

    {/* monthly cancels */}
    <div style={CS}>
      <SectionLabel>Contracts Lost per Month (Aug projected)</SectionLabel>
      <SvgBarChart data={recentWithProj} dataKey="cl" colorFn={()=>"#D64242"} xKey="m" yFmt={v=>v} height={130}/>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:6}}>{projAugLoggedSoFar} cancels logged so far in August, projected to ~{projAugTotal} at the current pace.</div>
    </div>

    {/* churn vs deals closed trend line */}
    <div style={CS}>
      <SectionLabel>Churn Rate vs Deals Closed — Trailing 18 Months (Aug projected)</SectionLabel>
      <SvgLineChart data={recentWithProj} lines={[{key:'cr',name:'Churn Rate (%)',stroke:'#D64242',width:2.5},{key:'dc',name:'Deals Closed (#)',stroke:'#2D9CDB',width:2.5}]} xKey="m" height={170}/>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:6,lineHeight:1.5}}>
        Straight read of the two lines: churn (red) has climbed for four straight closed months — 12.15% (Apr) → 24.55% (May) → 18.35% (Jun) → 20.52% (Jul) — before the August pace-projection (hollow marker) drops it to ~{projAugRate}%.
        Deals Closed (blue) has fallen over the same stretch — {data[data.length-4].dc} (Apr) → {data[data.length-3].dc} (May) → {data[data.length-2].dc} (Jun) → {last.dc} (Jul) — with August's early pace ({projAugDcSoFar} logged through Aug {projAugAsOfDay}) projecting a rebound to ~{projAugDc}.
        Both August figures are projections from a partial month, not confirmed closes.
      </div>
    </div>

    {/* churn by reason (May) */}
    <div style={CS}>
      <SectionLabel>May Churn by Reason — Count &amp; Weighted Impact</SectionLabel>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:-2,marginBottom:8}}>Latest month with a verified reason code per account. June/July cancellations are reflected in the company-wide totals above but not yet reason-coded.</div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:4}}>
        {reasons.map((x,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:140,fontSize:11,color:TEXT,fontFamily:FONT_BODY,fontWeight:600,textAlign:"right",flexShrink:0}}>{x.r}</div>
            <div style={{flex:1,height:18,background:"#FAFAFA",borderRadius:3,overflow:"hidden",position:"relative"}}>
              <div style={{width:(x.n/maxReasonN*100)+"%",height:"100%",background:rsnCol(x.r==="Uncategorized"?null:x.r)}}/>
            </div>
            <div style={{width:120,fontSize:10,color:MUTED,fontFamily:FONT_MONO,flexShrink:0}}>{x.n} acct{x.n===1?"":"s"} · wt {x.w}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:10}}>
        {mayCh.length} total May cancellations · weighted churn-impact score {totWeight} (penalty by reason: Rep/Ops Issue=8, Lack of Results/No Closed Deals=6, Single Rep/No Show=5, Poor List/Slow Start=3, Leadership=2, Budget/Didn't Pay/Landbase/uncategorized=1).
      </div>
    </div>

    {/* per-SOM May churn */}
    <div style={CS}>
      <SectionLabel>May Churn by Sales Ops Manager (month-end)</SectionLabel>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:-2,marginBottom:8}}>Latest month with a verified account→SOM assignment for every cancellation. A handful of June/July churned accounts couldn't yet be matched to a SOM with confidence — see Methodology.</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontFamily:FONT_BODY}}>
        <thead><tr style={{borderBottom:"1px solid "+BORDER2}}>
          {["SOM","May Churns","May Rate","Apr Rate","Accounts Lost"].map((h,i)=>(
            <th key={i} style={{textAlign:i<1?"left":i<4?"center":"left",fontSize:9,color:MUTED,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",padding:"8px 10px"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {somRows.map((r,i)=>{
            const rc = r.mayR===0?G:r.mayR<=10?G:r.mayR<=20?"#E5A000":"#D64242";
            return (<tr key={i} style={{borderBottom:"1px solid "+BORDER}}>
              <td style={{padding:"9px 10px",fontSize:12,color:TEXT,fontWeight:600}}>{r.name}</td>
              <td style={{padding:"9px 10px",fontSize:13,color:"#D64242",fontWeight:800,fontFamily:FONT_DISPLAY,textAlign:"center"}}>{r.may}</td>
              <td style={{padding:"9px 10px",fontSize:13,color:rc,fontWeight:800,fontFamily:FONT_DISPLAY,textAlign:"center"}}>{r.mayR}%</td>
              <td style={{padding:"9px 10px",fontSize:11,color:MUTED,fontFamily:FONT_MONO,textAlign:"center"}}>{r.aprR!=null?r.aprR+"%":"—"}</td>
              <td style={{padding:"9px 10px"}}>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {r.mayn.map((n,j)=><span key={j} style={{fontSize:9.5,padding:"2px 8px",background:"#F4F4F5",color:MUTED,borderRadius:3,fontFamily:FONT_BODY}}>{n}</span>)}
                </div>
              </td>
            </tr>);
          })}
        </tbody>
      </table>
      <div style={{fontSize:10,color:MUTED2,fontFamily:FONT_BODY,marginTop:10}}>Per-SOM rate = that SOM's May churns ÷ avg(active Feb/Mar/Apr) × 100. Total {somRows.reduce((s,r)=>s+r.may,0)} accounts lost across all portfolios.</div>
    </div>
  </div>);
}
